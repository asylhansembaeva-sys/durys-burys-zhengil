<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дұрыс па, бұрыс па?</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9ed;color:#11166e;font-family:Arial,sans-serif}main{max-width:1600px;margin:auto;padding:2vw;min-height:100vh;display:flex;flex-direction:column;gap:1.5vh}h1{margin:0;text-align:center;background:linear-gradient(#ff4b4b,#d00000 55%,#a50000);border:4px solid #ffce38;border-radius:30px;color:white;padding:1.4vh;font-size:clamp(26px,4vw,65px);text-shadow:2px 3px #850000}h1 span{color:#ffed36}.panel{display:flex;align-items:center;gap:2vw;border:4px solid #a000e9;border-radius:30px;background:white;padding:1.5vw;flex:1}.panel img{width:32%;border-radius:22px;border:3px solid #a000e9}.right{flex:1;text-align:center}.count{display:inline-block;background:#ffed54;border-radius:25px;padding:5px 30px;font-size:clamp(20px,2.5vw,40px);font-weight:bold}#question{font-weight:800;font-size:clamp(25px,3.4vw,55px);margin:2vh 0;line-height:1.2}.buttons{display:flex;gap:1vw;justify-content:center}button{cursor:pointer;border:3px solid #ffcc30;border-radius:24px;color:white;font-weight:bold;font-size:clamp(20px,2.7vw,44px);padding:1.2vh 2vw;box-shadow:0 5px 0 #ad7b00}button:disabled{opacity:.55;cursor:default}.yes{background:linear-gradient(#54e61a,#008600)}.no{background:linear-gradient(#ff4949,#d00000)}.purple{background:linear-gradient(#bd3cff,#7100c8)}#feedback{min-height:13vh;border:3px solid #e8b300;border-radius:24px;background:#fffde4;padding:1.4vh 2vw;font-size:clamp(20px,2.4vw,38px);font-weight:bold;text-align:center}footer{display:flex;justify-content:space-between;align-items:center;gap:12px}#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.dot{border-radius:50%;background:#e8d5ff;padding:8px 12px;font-weight:bold}.active{background:#ffe33c}.done{background:#b7ed9b}@media(max-width:700px){.panel{flex-direction:column}.panel img{width:45%}footer{flex-wrap:wrap}}

*, *::before, *::after { font-family: "Times New Roman", Times, serif !important; }

#dots{gap:clamp(6px,0.8vw,12px);flex:1;}button.dot{width:clamp(44px,4.5vw,72px);height:clamp(44px,4.5vw,72px);font-size:clamp(25px,2.7vw,42px);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}

ults[j]===true?'done':results[j]===false?'wrong':''}" onclick="jump(${j})" aria-label="${j+1}-сұрақ">${j+1}</button>`).join('')}function jump(j){i=j;render()}function render(){answered=false;el('next').textContent='Келесі »';el('count').textContent=(i+1)+' / '+Q.length;el('question').textContent=Q[i][0];el('feedback').textContent='Жауабыңызды таңдаңыз. Қызыл дөңгелекті басып, қате сұраққа қайта орала аласыз.';el('next').disabled=true;document.querySelectorAll('.buttons button').forEach(b=>b.disabled=false);dots()}function answer(v){if(answered)return;answered=true;let ok=v===Q[i][1];playFeedback(ok);results[i]=ok;el('feedback').textContent=(ok?'✔ Дұрыс жауап! ':'Дұрыс жауап: '+(Q[i][1]?'Дұрыс. ':'Бұрыс. '))+Q[i][2];document.querySelectorAll('.buttons button').forEach(b=>b.disabled=true);el('next').disabled=false;el('next').textContent=i===Q.length-1?'Қорытынды »':'Келесі »';dots()}function next(){if(!answered)return;if(i<Q.length-1){i++;render()}else{el('count').textContent='10 / 10';el('question').textContent='Жарайсыздар!';el('feedback').textContent='Нәтиже: '+results.filter(x=>x===true).length+' / 10. Балаға үлгі болайық, жанжалды бейбіт шешейік!';el('next').disabled=true}}function reset(){if(!confirm("Ойынды басынан бастайсыз ба?"))return;i=0;results.fill(null);render()}render();</script></html>
